name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# cancela o run anterior da mesma branch/PR quando um push novo chega, pra nao
# gastar minutos de CI rodando algo que ja ficou obsoleto
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- backend ----------

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # cobertura minima (90%) configurada em pyproject.toml [tool.coverage.report]
      - run: pytest --cov --cov-report=term-missing

  # roda as migrations do zero num banco descartavel e confere se os models
  # bateram com a ultima migration - pega o caso de esquecer de gerar uma
  # migration nova depois de mudar um model (a causa dos incidentes de
  # deploy que ja tivemos com o Alembic).
  backend-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: ci-check-secret-key-com-pelo-menos-32-bytes
      DATABASE_URL: sqlite:///./ci_migrations_check.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: alembic upgrade head

      - name: Confere se os models batem com a ultima migration
        run: alembic check

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pip-audit (vulnerabilidades conhecidas nas dependencias)
        run: pip-audit -r requirements.txt

      # low severity ignorado de proposito: os 2 achados atuais (cookie name
      # confundido com senha, random.choice numa escolha sem fim criptografico)
      # sao falsos positivos conhecidos, nao segredos/uso inseguro de fato
      - name: bandit (analise estatica de seguranca)
        run: bandit -r app backup_banco.py restaurar_backup.py limpar_dados_antigos.py --severity-level medium

  # ---------- frontend ----------

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # cobertura minima (90%) configurada em vite.config.js -> test.coverage.thresholds
      - run: npm run test:coverage

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit (vulnerabilidades conhecidas nas dependencias)
        run: npm audit

  # ---------- repo inteiro ----------

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historico completo, gitleaks varre todos os commits

      - name: Instala gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Procura segredo commitado
        run: gitleaks detect --source . --redact -v

  # ---------- integracao e gate ----------

  e2e:
    needs:
      [
        backend-lint,
        backend-tests,
        backend-migrations,
        backend-security,
        frontend-lint,
        frontend-tests,
        frontend-build,
        frontend-security,
        secret-scan,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # playwright.config.js espera o interpretador em backend/venv/bin/python
      - name: Cria venv do backend
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Instala browsers do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Roda testes e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload do relatorio do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  ci-ok:
    needs:
      [
        backend-lint,
        backend-tests,
        backend-migrations,
        backend-security,
        frontend-lint,
        frontend-tests,
        frontend-build,
        frontend-security,
        secret-scan,
        e2e,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verifica se algum job falhou
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Um ou mais jobs falharam."
            exit 1
          fi
