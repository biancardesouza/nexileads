[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# so pyflakes + pycodestyle "erros" (equivalente ao flake8 classico); regras de
# estilo (bugbear, datetimez, isort, simplify, etc.) ficam de fora por ora pra
# nao misturar "adicionar lint" com "reescrever estilo do codigo existente".
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app", "backup_banco", "restaurar_backup", "limpar_dados_antigos"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]
